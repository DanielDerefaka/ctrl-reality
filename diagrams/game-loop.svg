<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#e7e0d2}.t{font:700 32px Georgia,serif;letter-spacing:2px}.h{font-size:16px;font-weight:900;letter-spacing:1px}.b{font-size:13px;fill:#aab7c1}.n{font:700 24px Georgia,serif}.box{fill:#14131a;stroke:#a77b3e;stroke-width:2}.cyan{fill:#102326;stroke:#55d9e2;stroke-width:2}.arrow{stroke:#e6c978;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e6c978"/></marker></defs><rect width="1400" height="800" fill="#07090e"/><text x="65" y="70" class="t">THE PLAY LOOP · PROGRAM A CREW BY PLAYING</text><text x="65" y="102" class="b">Every failure becomes useful information and, when committed, a physical collaborator.</text>
<g transform="translate(70 180)"><rect width="210" height="210" rx="105" class="box"/><text x="105" y="64" text-anchor="middle" class="n">1</text><text x="105" y="105" text-anchor="middle" class="h">OBSERVE</text><text x="105" y="133" text-anchor="middle" class="b">Read plate, gate,</text><text x="105" y="155" text-anchor="middle" class="b">hazard, objective.</text></g>
<g transform="translate(360 180)"><rect width="210" height="210" rx="105" class="box"/><text x="105" y="64" text-anchor="middle" class="n">2</text><text x="105" y="105" text-anchor="middle" class="h">DEMONSTRATE</text><text x="105" y="133" text-anchor="middle" class="b">Physically perform one</text><text x="105" y="155" text-anchor="middle" class="b">role in 20 seconds.</text></g>
<g transform="translate(650 180)"><rect width="210" height="210" rx="105" class="cyan"/><text x="105" y="64" text-anchor="middle" class="n">3</text><text x="105" y="105" text-anchor="middle" class="h">REWIND</text><text x="105" y="133" text-anchor="middle" class="b">Restore the vault.</text><text x="105" y="155" text-anchor="middle" class="b">Keep the behavior.</text></g>
<g transform="translate(940 180)"><rect width="210" height="210" rx="105" class="cyan"/><text x="105" y="64" text-anchor="middle" class="n">4</text><text x="105" y="105" text-anchor="middle" class="h">COOPERATE</text><text x="105" y="133" text-anchor="middle" class="b">Second Hand repeats</text><text x="105" y="155" text-anchor="middle" class="b">the demonstrated role.</text></g>
<path d="M280 285H350" class="arrow"/><path d="M570 285H640" class="arrow"/><path d="M860 285H930" class="arrow"/><path d="M1150 285 Q1280 285 1280 455 Q1280 625 1065 625 H300 Q175 625 175 400" class="arrow"/>
<rect x="455" y="500" width="490" height="170" rx="18" class="box"/><text x="700" y="545" text-anchor="middle" class="h">COMPOSE THE FINAL PLAN</text><text x="700" y="578" text-anchor="middle" class="b">Anchor holds the plate · Turner holds the crank · Latch opens the timing window</text><text x="700" y="607" text-anchor="middle" class="b">The current thief crosses the route, takes the Chronoglass, and exits.</text><text x="700" y="642" text-anchor="middle" style="font:italic 18px Georgia;fill:#e6c978">Rewind is not undo. It is recruitment.</text></svg>
