<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
text{font-family:Inter,Arial,sans-serif;fill:#e7e0d2}.title{font:700 32px Georgia,serif;letter-spacing:2px}.sub{font-size:14px;fill:#91a3b1}.label{font-weight:800;font-size:14px;letter-spacing:1px}.body{font-size:13px}.box{fill:#14131a;stroke:#a77b3e;stroke-width:2}.soft{fill:#11151d;stroke:#3d4b58;stroke-width:2}.hero{fill:#182326;stroke:#55d9e2;stroke-width:2}.arrow{stroke:#e6c978;stroke-width:2.2;fill:none;marker-end:url(#head)}.data{stroke:#70879a;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#head2)}
</style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e6c978"/></marker><marker id="head2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70879a"/></marker></defs>
<rect width="1400" height="900" fill="#07090e"/><text x="70" y="70" class="title">SECOND HANDS · TECHNICAL ARCHITECTURE</text><text x="70" y="100" class="sub">Plain deterministic game state drives generated 404 views. Scene transforms are not the source of truth.</text>
<rect x="70" y="160" width="250" height="150" rx="12" class="box"/><text x="95" y="195" class="label">BROWSER SHELL</text><text x="95" y="225" class="body">index.html + CSS overlay UI</text><text x="95" y="250" class="body">one-tap start + audio unlock</text><text x="95" y="275" class="body">visibility / resize / safe area</text>
<rect x="70" y="370" width="250" height="180" rx="12" class="soft"/><text x="95" y="405" class="label">INPUT LAYER</text><text x="95" y="435" class="body">touch joystick</text><text x="95" y="460" class="body">ACT + REWIND buttons</text><text x="95" y="485" class="body">keyboard fallback</text><text x="95" y="510" class="body">normalized intent only</text>
<rect x="410" y="160" width="300" height="390" rx="14" class="hero"/><text x="440" y="198" class="label">FIXED 60 HZ GAME STATE</text><text x="440" y="230" class="body">player + echo actors</text><text x="440" y="255" class="body">loop time + chamber baseline</text><text x="440" y="280" class="body">mechanism logical state</text><text x="440" y="305" class="body">objective + scoring</text><line x1="440" y1="326" x2="680" y2="326" stroke="#32575a"/><text x="440" y="358" class="label">SYSTEMS</text><text x="440" y="388" class="body">movement / analytic collision</text><text x="440" y="413" class="body">30 Hz recorder / track player</text><text x="440" y="438" class="body">interaction capability checks</text><text x="440" y="463" class="body">rewind / reset registry</text><text x="440" y="488" class="body">hazard / score / save</text><text x="440" y="522" class="sub">No physics engine. No runtime AI.</text>
<rect x="800" y="160" width="250" height="185" rx="12" class="box"/><text x="825" y="197" class="label">VIEW ADAPTERS</text><text x="825" y="227" class="body">logical state → pivots</text><text x="825" y="252" class="body">door open amount</text><text x="825" y="277" class="body">plate travel + gears</text><text x="825" y="302" class="body">echo material treatment</text>
<rect x="1120" y="160" width="220" height="185" rx="12" class="box"/><text x="1145" y="197" class="label">THREE.JS VIEW</text><text x="1145" y="227" class="body">404-generated modules</text><text x="1145" y="252" class="body">fixed camera + lights</text><text x="1145" y="277" class="body">pooled VFX + interpolation</text><text x="1145" y="302" class="body">renderer metrics</text>
<rect x="800" y="415" width="250" height="135" rx="12" class="soft"/><text x="825" y="452" class="label">HTML/CSS HUD</text><text x="825" y="482" class="body">timer / slots / objective</text><text x="825" y="507" class="body">prompts / results / settings</text>
<rect x="410" y="640" width="300" height="145" rx="12" class="soft"/><text x="440" y="677" class="label">PUBLIC TELEMETRY</text><text x="440" y="707" class="body">__READY__ · __START__ · __GAME__</text><text x="440" y="732" class="body">position / mechanic state / metrics</text><text x="440" y="757" class="sub">read-only proof, never a cheat path</text>
<rect x="800" y="640" width="540" height="145" rx="12" class="hero"/><text x="830" y="677" class="label">TEST + RELEASE EVIDENCE</text><text x="830" y="707" class="body">unit tests · custom CDP touch gate · official jam gate</text><text x="830" y="732" class="body">moving filmstrips · phone logs · 404 receipts · scanner output</text><text x="830" y="757" class="sub">All final results tied to one HTTPS URL and commit SHA.</text>
<path d="M195 310 V370" class="arrow"/><path d="M320 460 H410" class="arrow"/><path d="M710 250 H800" class="arrow"/><path d="M1050 250 H1120" class="arrow"/><path d="M710 460 H800" class="data"/><path d="M560 550 V640" class="data"/><path d="M710 712 H800" class="data"/><path d="M1230 345 V610 Q1230 640 1200 640" class="data"/>
<text x="335" y="444" class="sub">intent</text><text x="734" y="236" class="sub">state</text><text x="1062" y="236" class="sub">parts</text><text x="716" y="442" class="sub">UI model</text>
</svg>
