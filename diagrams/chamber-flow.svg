<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#e7e0d2}.t{font:700 32px Georgia}.h{font-size:16px;font-weight:900;letter-spacing:1px}.b{font-size:13px;fill:#a6b4be}.card{fill:#14131a;stroke:#a77b3e;stroke-width:2}.echo{fill:#102326;stroke:#55d9e2;stroke-width:2}.arrow{stroke:#e6c978;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e6c978"/></marker></defs><rect width="1500" height="900" fill="#07090e"/><text x="70" y="70" class="t">THREE CHAMBERS · ONE COHERENT VAULT KIT</text><text x="70" y="102" class="b">Each chamber adds one coordination demand. Control complexity never increases.</text>
<g transform="translate(70 170)"><rect width="390" height="490" rx="18" class="card"/><text x="30" y="48" class="h">01 · THE FIRST LOCK</text><text x="30" y="78" class="b">Required echoes: 1</text><circle cx="195" cy="200" r="100" fill="#0c1016" stroke="#3b4a56"/><circle cx="140" cy="225" r="23" fill="#55d9e2" opacity=".65"/><rect x="118" y="248" width="44" height="16" rx="8" fill="#e6c978"/><rect x="232" y="143" width="70" height="100" rx="35" fill="#090a0f" stroke="#a77b3e" stroke-width="6"/><circle cx="205" cy="270" r="18" fill="#e7e0d2"/><text x="30" y="345" class="h">LEARN</text><text x="30" y="375" class="b">An echo holds its final pose.</text><text x="30" y="403" class="b">Presence opens a gate.</text><text x="30" y="445" class="h">AHA MOMENT</text><text x="30" y="473" class="b">“My failed route is now useful.”</text></g>
<g transform="translate(555 170)"><rect width="390" height="490" rx="18" class="echo"/><text x="30" y="48" class="h">02 · THE SPLIT DIAL</text><text x="30" y="78" class="b">Required echoes: 2</text><circle cx="195" cy="200" r="100" fill="#0c1016" stroke="#3b4a56"/><circle cx="125" cy="235" r="21" fill="#55d9e2" opacity=".65"/><rect x="103" y="258" width="44" height="14" rx="7" fill="#e6c978"/><circle cx="255" cy="176" r="24" fill="#9277e9" opacity=".65"/><circle cx="255" cy="176" r="41" fill="none" stroke="#a77b3e" stroke-width="7"/><path d="M195 200 L292 200" stroke="#e6c978" stroke-width="9"/><circle cx="195" cy="200" r="12" fill="#07090e" stroke="#e6c978" stroke-width="4"/><text x="30" y="345" class="h">COMBINE</text><text x="30" y="375" class="b">Anchor holds the plate.</text><text x="30" y="403" class="b">Turner holds the crank.</text><text x="30" y="431" class="b">Current thief crosses the sweep.</text><text x="30" y="473" class="b">Timing pressure enters, no new control.</text></g>
<g transform="translate(1040 170)"><rect width="390" height="490" rx="18" class="card"/><text x="30" y="48" class="h">03 · THE HEART VAULT</text><text x="30" y="78" class="b">Required echoes: 3</text><circle cx="195" cy="200" r="100" fill="#0c1016" stroke="#3b4a56"/><circle cx="115" cy="235" r="19" fill="#55d9e2"/><circle cx="260" cy="245" r="19" fill="#9277e9"/><circle cx="250" cy="135" r="19" fill="#e1b55a"/><circle cx="195" cy="210" r="20" fill="#e7e0d2"/><path d="M195 185 L210 205 L195 230 L180 205 Z" fill="#c8fff2" stroke="#e6c978" stroke-width="4"/><text x="30" y="345" class="h">CHOREOGRAPH</text><text x="30" y="375" class="b">Plate + crank + timed latch.</text><text x="30" y="403" class="b">Current thief takes Chronoglass.</text><text x="30" y="445" class="h">PAYOFF</text><text x="30" y="473" class="b">All four bodies visible in one plan.</text></g>
<path d="M460 415H545" class="arrow"/><path d="M945 415H1030" class="arrow"/>
