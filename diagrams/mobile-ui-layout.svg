<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#e7e0d2}.t{font:700 30px Georgia}.h{font-size:14px;font-weight:900;letter-spacing:1px}.b{font-size:12px;fill:#99aab6}.line{stroke:#e6c978;stroke-width:2;fill:none;marker-end:url(#a)}.zone{fill:#14131a;stroke:#70879a;stroke-width:2}.ctrl{fill:#1a1714;stroke:#e6c978;stroke-width:2}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e6c978"/></marker></defs><rect width="1000" height="1120" fill="#07090e"/><text x="65" y="65" class="t">390 × 844 MOBILE UI LAYOUT</text><text x="65" y="94" class="b">Controls avoid the central route and remain inside safe-area insets.</text>
