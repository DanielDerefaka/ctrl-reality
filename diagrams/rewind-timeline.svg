<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#e7e0d2}.t{font:700 32px Georgia;letter-spacing:2px}.h{font-size:14px;font-weight:900;letter-spacing:1px}.b{font-size:12px;fill:#9badb9}.tick{stroke:#70879a}.phase{stroke:#07090e;stroke-width:3}.arrow{stroke:#e6c978;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e6c978"/></marker></defs><rect width="1500" height="720" fill="#07090e"/><text x="70" y="70" class="t">SIGNATURE REWIND · 0.86 SECOND STATE TRANSITION</text><text x="70" y="103" class="b">Gameplay freezes, the room visually reverses to its immutable baseline, the completed track becomes an echo, then the next loop starts.</text>
<line x1="90" y1="200" x2="1410" y2="200" stroke="#e6c978" stroke-width="4"/>
<g><rect x="90" y="165" width="125" height="70" rx="8" fill="#37231f" class="phase"/><text x="152" y="193" text-anchor="middle" class="h">LATCH</text><text x="152" y="216" text-anchor="middle" class="b">0–80 ms</text></g>
<g><rect x="215" y="165" width="750" height="70" rx="8" fill="#173039" class="phase"/><text x="590" y="193" text-anchor="middle" class="h">REVERSE WORLD</text><text x="590" y="216" text-anchor="middle" class="b">80–560 ms</text></g>
<g><rect x="965" y="165" width="315" height="70" rx="8" fill="#242348" class="phase"/><text x="1122" y="193" text-anchor="middle" class="h">IMPRINT ECHO</text><text x="1122" y="216" text-anchor="middle" class="b">560–760 ms</text></g>
<g><rect x="1280" y="165" width="130" height="70" rx="8" fill="#3b3020" class="phase"/><text x="1345" y="193" text-anchor="middle" class="h">RELEASE</text><text x="1345" y="216" text-anchor="middle" class="b">760–860 ms</text></g>
<g transform="translate(90 310)"><text class="h">LOGIC ORDER</text><text y="38" class="b">1. Reject invalid/empty commit</text><text y="66" class="b">2. Finalize 30 Hz frames and ordered events</text><text y="94" class="b">3. Add track to persistent echo slots</text><text y="122" class="b">4. Restore chamber baseline snapshot</text><text y="150" class="b">5. Reset current player, input, loop time</text><text y="178" class="b">6. Start every persistent track at t = 0</text></g>
<g transform="translate(550 310)"><text class="h">VISUAL ORDER</text><text y="38" class="b">input locks · clock impact</text><text y="66" class="b">saturation drains · hand/gears reverse</text><text y="94" class="b">gate/plate/crank interpolate to baseline</text><text y="122" class="b">recorded route pulls into colored filament</text><text y="150" class="b">porcelain echo resolves at spawn</text><text y="178" class="b">color returns · HUD slot fills</text></g>
<g transform="translate(1030 310)"><text class="h">AUDIO / HAPTIC</text><text y="38" class="b">short latch tick</text><text y="66" class="b">reverse mechanical swell</text><text y="94" class="b">descending gear chatter</text><text y="122" class="b">single echo crystallization tone</text><text y="150" class="b">light haptic pulse</text><text y="178" class="b">normal clock bed resumes</text></g>
<rect x="90" y="570" width="1320" height="75" rx="12" fill="#14131a" stroke="#a77b3e"/><text x="120" y="601" class="h">NON-NEGOTIABLE</text><text x="120" y="627" class="b">The visual rewind never becomes the logical source of truth. Logic restores immediately from baseline; view animation communicates that restoration and ends in the same state.</text></svg>
